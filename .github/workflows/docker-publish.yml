name: Build and Push to Docker Hub

# Triggers on pushes to main AND when a new tag is pushed (e.g., v1.0.0)
on:
  push:
    branches:
      - main 
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Extract metadata to dynamically generate tags
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fbhooked
          tags: |
            # 1. Always tag with the short commit SHA (e.g., sha-8c3b4a1)
            type=sha
            # 2. Tag with the git tag on release (e.g., v1.2.0)
            type=ref,event=tag
            # 3. Tag with 'latest' ONLY when pushing to the main branch
            type=raw,value=latest,enable={{is_default_branch}}

      # Pass the dynamic tags and labels to the build step
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}